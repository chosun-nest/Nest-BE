# Port Number
server:
  port: 6030 # Conflict occurred with Tomcat in JSP...ㅠㅠ

spring:
  datasource:
    # 환경변수로 설정 가능 (Docker Compose 또는 로컬)
    # 로컬 개발: localhost:3306
    # Docker: mysql:3306 (서비스명)
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nest_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:nest}
    password: ${SPRING_DATASOURCE_PASSWORD:nest}
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    host: smtp.gmail.com
    port: 587
    username: glosori.help@gmail.com
    password: jzdschbukjgnjffz
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
    default-encoding: UTF-8

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

jwt:
  secret: VUkwMS0xMjM0LTU2NzgtOWFiYy1kZWZnaGk=
  access-token-expiration: 3600000  # 1 hour (in milliseconds)
  refresh-token-expiration: 604800000  # 7 days (in milliseconds)

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    url: /v3/api-docs
    csrf:
      enabled: false  # ✅ CSRF 설정이 Swagger 요청을 차단할 수 있으므로 비활성화

# 애플리케이션 설정
app:
  data:
    init:
      enabled: true  # 초기 데이터 자동 생성 (태그 등) - false로 설정하면 비활성화